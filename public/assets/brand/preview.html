<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARTORA · Identidade visual</title>
  <link rel="icon" type="image/svg+xml" href="artora-favicon.svg" />
  <style>
    *{box-sizing:border-box}body{margin:0;background:#EEF1F5;color:#14243A;font-family:system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:48px 28px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:32px}h1{margin:0;font-size:24px;font-weight:600}header p{margin:0;font-size:12px}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{margin:0;border:1px solid #14243A20;border-radius:12px;overflow:hidden}.primary{grid-column:1/-1;background:#14243A;color:#F7F8FA}.white{background:#0D1828;color:#F7F8FA}.navy{background:#F7F8FA}.logo{display:grid;place-items:center;min-height:200px;padding:30px}.primary .logo{min-height:260px}.logo img{width:min(100%,320px);height:auto}.primary .logo img{width:min(100%,400px)}figcaption{padding:16px 22px;border-top:1px solid #C5A45D40;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.symbols{display:flex;align-items:center;gap:28px;margin:28px 0;padding:22px;background:#F7F8FA;border-radius:12px}.symbols img{display:block}.symbols p{margin:0 0 0 auto;font-size:12px}footer{font-size:12px;line-height:1.7;color:#52647A}a{color:inherit}@media(max-width:600px){main{padding:28px 18px}header{display:block}header p{margin-top:10px}section{grid-template-columns:1fr}.primary{grid-column:auto}.symbols{flex-wrap:wrap}.symbols p{width:100%;margin:0}}
  </style>
</head>
<body>
  <main>
    <header><h1>ARTORA</h1><p>Identidade visual · Arte para sua tela</p></header>
    <section aria-label="Versões da marca">
      <figure class="card primary"><div class="logo"><img src="artora-logo.svg" alt="ARTORA — Arte para sua tela, em dourado e branco" /></div><figcaption>Principal · sobre marinho</figcaption></figure>
      <figure class="card navy"><div class="logo"><img src="artora-logo-navy.svg" alt="Marca ARTORA monocromática marinho" /></div><figcaption>Monocromática · marinho</figcaption></figure>
      <figure class="card white"><div class="logo"><img src="artora-logo-white.svg" alt="Marca ARTORA monocromática branca" /></div><figcaption>Monocromática · branco</figcaption></figure>
    </section>
    <div class="symbols" aria-label="Símbolo e teste de redução">
      <img src="artora-symbol-navy.svg" width="64" height="64" alt="Símbolo ARTORA, 64 pixels" />
      <img src="artora-symbol-navy.svg" width="32" height="32" alt="Símbolo ARTORA, 32 pixels" />
      <img src="artora-symbol-navy.svg" width="24" height="24" alt="Símbolo ARTORA, 24 pixels" />
      <img src="artora-favicon.svg" width="16" height="16" alt="Favicon ARTORA, 16 pixels" />
      <p>Moldura aberta + monograma A</p>
    </div>
    <footer>SVGs com fundo transparente e letras convertidas em curvas. <a href="README.md">Guia de arquivos e aplicação</a> · <a href="/">Ver a landing page</a></footer>
  </main>
</body>
</html>
